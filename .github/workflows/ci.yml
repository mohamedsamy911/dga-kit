# The pre-merge checks, on every push and pull request.
#
# The GATES are offline: they compare this repo against itself. That is deliberate - the failure
# mode this kit actually has is the guidance drifting from the evidence on disk, not DGA moving.
# The DGA-facing sentinel is a separate, scheduled workflow (dga-freshness.yml), and nothing here
# contacts design.dga.gov.sa.
#
# Bootstrap steps use the network, but none talks to DGA:
#   * checkout and setup actions fetch the repository and toolchains.
#   * the check job and installer matrix install PyYAML for YAML/conversion tests.
#   * "Tailwind preset actually builds" installs tailwindcss from npm.
# An earlier version of this header claimed "none of these touch the network" while the Tailwind
# step ran `npm i`. If you add a networked step, amend this list rather than the claim.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install PyYAML
        # Needed by the openai.yaml checks in validate-fixtures.py. Those checks FAIL rather than
        # skip when it is absent, so this step is load-bearing, not convenience.
        run: python -m pip install --quiet pyyaml

      - name: Fixtures match the harvested tokens
        run: python evals/validate-fixtures.py

      - name: Quotes still say what DGA said
        run: python evals/check-quote-fidelity.py --ci

      - name: The monitoring detects what it claims to
        run: python evals/test-automation.py

      - name: Reconciler self-check
        # Offline: the live reconciliation runs in the freshness workflow, but its classification
        # and reporting logic is asserted here. Three defects review found in it - resolution
        # ignoring the cascade, classification keyed by name across themes, and a report whose
        # categories did not sum to its own total - were all invisible to a run that simply
        # succeeded.
        run: python harvest/reconcile-tokens.py --test

      - name: Installer self-check
        # Symlink refusal and the agent-payload validation, which the end-to-end matrix below
        # cannot easily reach. These moved here from the Python installer's unittest suite when
        # three installers became one.
        run: node bin/dga-kit.mjs --test

      - name: Codex agents match their Markdown sources
        # codex-agents/*.toml is generated from agents/*.md. An agent edited in Markdown and not
        # regenerated ships stale guidance to every Codex user, and nothing else would catch it.
        run: python evals/build-codex-agents.py --check

      - name: Codex agent conversion and installer regressions
        run: python evals/test-codex-agents.py

      - name: Eval JSON matches the markdown cases
        # skills/*/evals/evals.json is what `claude plugin eval` reads; the markdown cases under
        # evals/*/cases/ are what a human reviews. Generated, never hand-edited - a case added in
        # markdown and not regenerated is a case the runner never runs.
        run: python evals/build-evals-json.py --check

      - name: Native Codex agents match the Claude sources
        run: python evals/build-codex-agents.py --check

      - name: Codex agent conversion and installer safety
        run: python evals/test-codex-agents.py

      - name: Contrast maths self-check
        run: node skills/dga-design-system/assets/check-contrast.mjs --test

      - name: Generated token files are up to date
        # A hand-edited tokens.css silently diverges from tokens.json, and every consumer gets
        # the stale one. Regenerate and fail if anything moved.
        run: |
          node skills/dga-design-system/assets/generate-tokens.mjs
          git diff --exit-code -- skills/dga-design-system/assets/tokens.css \
                                  skills/dga-design-system/assets/tailwind-preset.js

      - name: Codex's own plugin validator
        # The repo claims (README, INSTALL, CHANGELOG) that it passes Codex's validator. That
        # claim was unguarded: our fixtures emulate the schema, and an emulation stays green when
        # the real contract moves. The validator ships inside a Codex installation, which a
        # runner does not have - so this locates it and reports plainly when it is absent rather
        # than passing in silence. Locally it runs for real.
        run: |
          V=$(find "$HOME/.codex/skills/.system/plugin-creator/scripts" -name validate_plugin.py \
                2>/dev/null | head -1 || true)
          if [ -z "$V" ]; then
            echo "SKIPPED: no Codex installation on this runner, so the official validator"
            echo "could not run. The fixtures' emulation of the schema still ran."
            echo "Run it locally before releasing:"
            echo "  python ~/.codex/skills/.system/plugin-creator/scripts/validate_plugin.py ."
            exit 0
          fi
          python -m pip install --quiet pyyaml
          python "$V" .

      - name: Installer parses and plans
        # Replaced `bash -n install-skills.sh`, which kept running for a full review round after
        # that file was deleted - the job failed on "No such file or directory" while the
        # gate-consistency checker passed, because its parser no longer recognised a `bash` gate.
        run: node --check bin/dga-kit.mjs

      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   .codex-plugin/plugin.json harvest/source-inventory.json \
                   skills/dga-design-system/assets/tokens.json; do
            python -c "import json,sys;json.load(open(sys.argv[1],encoding='utf-8'))" "$f"
          done

      - name: Tailwind preset actually builds
        # The preset is generated, and until now nothing ran it through Tailwind. A preset that
        # emits a malformed value fails here, not in a consumer's project. Uses the real compiler
        # against a fixture, and asserts a DGA token reaches the output CSS.
        run: |
          mkdir -p "$RUNNER_TEMP/tw" && cd "$RUNNER_TEMP/tw"
          npm init -y >/dev/null
          # Pinned exactly: a floating ^3 makes this smoke test non-reproducible, and a
          # Tailwind patch release would then look like a preset regression.
          npm i -D tailwindcss@3.4.17 >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE/skills/dga-design-system/assets/tailwind-preset.js" preset.mjs
          printf 'import p from "./preset.mjs";\nexport default {presets:[p],content:["./in.html"]};\n' > tailwind.config.mjs
          printf '<div class="text-display-md bg-white"></div>\n' > in.html
          printf '@tailwind base;@tailwind components;@tailwind utilities;\n' > in.css
          npx tailwindcss -c tailwind.config.mjs -i in.css -o out.css --minify
          grep -q '44px' out.css || { echo 'preset built but emitted no DGA line-height'; exit 1; }
          echo 'tailwind preset compiles and emits DGA values'

      - name: Installed layout resolves
        # Installs into a scratch HOME so the cross-reference and unshipped-reference checks run
        # against a real installed tree, not the repo layout.
        run: |
          export DGA_KIT_HOME="$RUNNER_TEMP/fakehome"
          export CODEX_HOME="$RUNNER_TEMP/fakecodex"
          mkdir -p "$DGA_KIT_HOME/.claude" "$CODEX_HOME"
          node bin/dga-kit.mjs | tee install.log
          grep -q 'cross-references OK' install.log

  # ONE installer now, but it still has to be proven on every platform it claims. The pair it
  # replaced had diverged in exactly this gap: `xargs -r` is GNU-only, so install-skills.sh
  # passed on Linux for months while being broken on the macOS it advertised.
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install, verify, re-run, uninstall
        shell: bash
        run: |
          set -euo pipefail
          export DGA_KIT_HOME="$RUNNER_TEMP/fakehome"
          export CODEX_HOME="$RUNNER_TEMP/fakecodex"
          mkdir -p "$DGA_KIT_HOME/.claude" "$CODEX_HOME"

          # A dry run must write nothing at all. Assert on the CHILDREN it would create, not on
          # .claude itself - the fixture creates that, so asserting its absence always failed.
          node bin/dga-kit.mjs --dry-run
          for p in "$DGA_KIT_HOME/.claude/skills" "$DGA_KIT_HOME/.claude/agents"                    "$DGA_KIT_HOME/.claude/.dga-kit-manifest" "$CODEX_HOME/agents"; do
            test ! -e "$p" || { echo "dry run wrote to disk: $p"; exit 1; }
          done

          node bin/dga-kit.mjs | tee install.log
          grep -q 'cross-references OK' install.log
          test -f "$DGA_KIT_HOME/.claude/skills/dga-design-system/SKILL.md"
          test -f "$DGA_KIT_HOME/.claude/agents/dga-designer.md"
          test -f "$CODEX_HOME/agents/dga-designer.toml"

          # Idempotent: a second run installs nothing and still succeeds.
          node bin/dga-kit.mjs | tee rerun.log
          grep -q 'already identical' rerun.log

          # An edited Codex agent is a REFUSAL, not an overwrite, and nothing is written.
          echo '# my own edit' >> "$CODEX_HOME/agents/dga-designer.toml"
          if node bin/dga-kit.mjs --codex; then echo 'overwrote an edited agent'; exit 1; fi
          grep -q 'my own edit' "$CODEX_HOME/agents/dga-designer.toml"
          # Put the pristine agent back: the selector test below asserts it SURVIVES a
          # --claude uninstall, and an edited-then-deleted fixture made that assertion fail
          # for a reason that had nothing to do with the selectors.
          rm "$CODEX_HOME/agents/dga-designer.toml"
          node bin/dga-kit.mjs --codex --agents
          test -f "$CODEX_HOME/agents/dga-designer.toml" || { echo 'failed to restore the agent'; exit 1; }

          # Uninstall HONOURS THE SELECTORS. `--claude --uninstall` used to delete Codex
          # agents too, because uninstall was dispatched before the flags were parsed.
          node bin/dga-kit.mjs --claude --uninstall
          test -f "$CODEX_HOME/agents/dga-designer.toml" || { echo '--claude uninstall ate Codex agents'; exit 1; }
          test ! -d "$DGA_KIT_HOME/.claude/skills/dga-design-system" || { echo '--claude uninstall kept Claude skills'; exit 1; }
          node bin/dga-kit.mjs   # put it back for the scoping test below

          # A kind-scoped uninstall leaves the other kind, and PRESERVES its manifest entries.
          node bin/dga-kit.mjs --claude --skills --uninstall
          test -f "$DGA_KIT_HOME/.claude/agents/dga-designer.md" || { echo '--skills uninstall ate agents'; exit 1; }
          grep -q 'dga-designer.md' "$DGA_KIT_HOME/.claude/.dga-kit-manifest"             || { echo 'excluded manifest entry was not preserved'; exit 1; }
          node bin/dga-kit.mjs

          # Uninstall removes only what it installed.
          touch "$DGA_KIT_HOME/.claude/skills/NOT-OURS.md"
          echo 'custom = 1' > "$CODEX_HOME/agents/my-agent.toml"
          node bin/dga-kit.mjs --uninstall
          test -f "$DGA_KIT_HOME/.claude/skills/NOT-OURS.md" || { echo 'uninstall ate a foreign file'; exit 1; }
          test -f "$CODEX_HOME/agents/my-agent.toml" || { echo 'uninstall ate a foreign agent'; exit 1; }
          test ! -d "$DGA_KIT_HOME/.claude/skills/dga-design-system" || { echo 'uninstall left its own skill'; exit 1; }
          echo "installer OK on ${{ matrix.os }}"

      - name: The real profile was never touched
        shell: bash
        run: |
          # A leak check phrased as a DELTA would need a baseline; here the override is the only
          # destination the installer is ever given, so the real profile must simply not exist.
          test ! -d "$HOME/.claude/skills/dga-design-system" || { echo 'wrote into the real profile'; exit 1; }
          test ! -f "$HOME/.codex/agents/dga-designer.toml"  || { echo 'wrote into the real profile'; exit 1; }
          echo 'no leak into the real profile'
