# The plugin remains dependency-free; this app has its own lockfile and build.
# Only showcase/dist is uploaded. Pull requests run the checks without Pages credentials.
name: Showcase Pages

on:
  push:
    branches: [master]
    paths: ['showcase/**', '.github/workflows/showcase-pages.yml']
  pull_request:
    paths: ['showcase/**', '.github/workflows/showcase-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showcase-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: showcase
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: showcase/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:theme
      - run: npx playwright install --with-deps chromium
      - name: Test the production build under /dga-kit/
        run: npm run test:e2e
      - name: Retain browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: showcase-browser-report
          path: |
            showcase/playwright-report/
            showcase/test-results/
          retention-days: 7
      - name: Upload only the tested static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'mohamedsamy911/dga-kit'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: showcase/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'mohamedsamy911/dga-kit'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
