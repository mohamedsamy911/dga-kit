interface:
  display_name: "DGA Design Review"
  short_description: "Review a screen against Platforms Code"
  brand_color: "#1B8354"
  default_prompt: "Use $dga-design-review to review this screen against DGA standards."

policy:
  # Codex defaults this to true. Pinned rather than inherited: these are compliance
  # skills, and the failure mode of a changed default is that Codex stops invoking them
  # AUTOMATICALLY. The skill would still load - it just never fires unless someone types
  # $dga-design-review by hand, and a team then ships believing it was checked.
  allow_implicit_invocation: true
