interface:
  display_name: "DGA Design System"
  short_description: "Foundations, components, tokens and patterns"
  brand_color: "#1B8354"
  default_prompt: "Use $dga-design-system to find what DGA says about this component."

policy:
  # Codex defaults this to true. Pinned rather than inherited: these are compliance
  # skills, and the failure mode of a changed default is that they silently stop
  # loading - a team then ships believing it was checked.
  allow_implicit_invocation: true
